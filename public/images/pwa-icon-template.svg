<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="512" height="512" fill="#0891b2" rx="80"/>

    <!-- Clock Circle -->
    <circle cx="256" cy="256" r="180" stroke="#ffffff" stroke-width="20" fill="none"/>

    <!-- Clock hands -->
    <line x1="256" y1="256" x2="256" y2="140" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="340" y2="340" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

    <!-- Center dot -->
    <circle cx="256" cy="256" r="16" fill="#ffffff"/>

    <!-- Hour markers -->
    <circle cx="256" cy="106" r="8" fill="#ffffff"/>
    <circle cx="406" cy="256" r="8" fill="#ffffff"/>
    <circle cx="256" cy="406" r="8" fill="#ffffff"/>
    <circle cx="106" cy="256" r="8" fill="#ffffff"/>
</svg>
