[package]
name = "solidtime-desktop"
version = "1.0.0"
description = "Solidtime Desktop - Automatic time tracking"
authors = ["Solidtime"]
license = "MIT"
repository = "https://github.com/solidtime/solidtime"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "notification-all", "global-shortcut-all", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
reqwest = { version = "0.11", features = ["json"] }
aes-gcm = "0.10"
base64 = "0.21"
sha2 = "0.10"
log = "0.4"
env_logger = "0.10"
dirs = "5.0"

# Platform-specific dependencies for activity tracking
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.51", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse"
] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = "2.21"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
